AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lab 5: Event-driven weekly reports pipeline.
  An EventBridge schedule (or manual on-demand trigger) sends an SQS message to invoke
  a builder Lambda inside the VPC. The builder queries Aurora, uploads reports/*.csv to S3
  via a Gateway VPC Endpoint, and S3 ObjectCreated events trigger a mailer Lambda outside
  the VPC to email the report via Amazon SES.

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess
    Description: Prefix for resource names.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where Aurora and the builder Lambda run.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets the builder Lambda attaches to.

  RouteTableIds:
    Type: List<String>
    Description: Route table IDs to associate with the S3 Gateway endpoint.

  FunctionSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowed to connect to the database.

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Async PostgreSQL connection string for the builder.

  ImageUri:
    Type: String
    Description: Pinned backend container image URI.

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [x86_64, arm64]
    Description: Target Lambda architecture.

  AppTimezone:
    Type: String
    Default: Europe/Kyiv
    Description: Application timezone for schedule and report timestamps.

  SenderEmail:
    Type: String
    Description: Verified sender email address in Amazon SES.

  RecipientEmail:
    Type: String
    Description: Recipient email address (verified in SES sandbox).

  ScheduleExpression:
    Type: String
    Default: cron(0 7 ? * MON *)
    Description: EventBridge schedule expression.

Resources:
  # =========================================================================
  # Step 2: S3 Bucket & Gateway VPC Endpoint
  # =========================================================================

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportsBucket:
    Type: AWS::S3::Bucket
    # Explicit dependency on MailerPermission avoids circular dependency with S3 notification
    DependsOn: MailerPermission
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # =========================================================================
  # Step 4: SQS Queues & Dead Letter Queue
  # =========================================================================

  ReportRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      # VisibilityTimeout >= 6x the builder's timeout of 60 seconds (360 seconds)
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # =========================================================================
  # Step 3 & 4: EventBridge Scheduler
  # =========================================================================

  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendToReportQueue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report-schedule"
      Description: Triggers weekly report calculation every Monday morning.
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: !Ref AppTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # =========================================================================
  # Step 3 & 4: Builder Lambda Function (In VPC)
  # =========================================================================

  BuilderFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReportBuilderPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      Description: Generates the weekly CSV report and writes it to S3.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - "app.reports.lambda_handler.handler"
      Architectures:
        - !Ref Architecture
      Role: !GetAtt BuilderFunctionRole.Arn
      MemorySize: 512
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref FunctionSecurityGroupId
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          APP_TIMEZONE: !Ref AppTimezone
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"
          LOG_LEVEL: INFO
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  BuilderEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !GetAtt BuilderFunction.Arn

  # =========================================================================
  # Step 5: Mailer Lambda Function (Outside VPC) & S3 Permission
  # =========================================================================

  MailerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReportMailerPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Description: Receives S3 ObjectCreated events and sends report CSV via Amazon SES.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MailerFunctionRole.Arn
      MemorySize: 256
      Timeout: 30
      Architectures:
        - !Ref Architecture
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          RECIPIENT_EMAIL: !Ref RecipientEmail
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import urllib.parse
          from email.message import EmailMessage
          import boto3

          logger = logging.getLogger("report_mailer")
          logger.setLevel(os.environ.get("LOG_LEVEL", "INFO"))
          if not logger.handlers:
              h = logging.StreamHandler()
              h.setFormatter(logging.Formatter("[%(levelname)s] %(asctime)s - %(message)s"))
              logger.addHandler(h)

          s3_client = boto3.client("s3")
          ses_client = boto3.client("sesv2")

          def handler(event, context):
              logger.info('report-mailer triggered {"trigger": "s3"}', extra={"trigger": "s3"})

              records = event.get("Records", [])
              if not records:
                  return {"status": "no_records"}

              sender = os.environ.get("SENDER_EMAIL")
              recipients_raw = os.environ.get("RECIPIENT_EMAIL", "")
              recipients = [r.strip() for r in recipients_raw.split(",") if r.strip()]

              for record in records:
                  s3_info = record.get("s3", {})
                  bucket = s3_info.get("bucket", {}).get("name")
                  raw_key = s3_info.get("object", {}).get("key")
                  if not bucket or not raw_key:
                      continue

                  key = urllib.parse.unquote_plus(raw_key)
                  logger.info("Processing S3 object s3://%s/%s", bucket, key)
                  response = s3_client.get_object(Bucket=bucket, Key=key)
                  content = response["Body"].read()

                  filename = os.path.basename(key)
                  msg = EmailMessage()
                  msg["Subject"] = f"Weekly Meetings Report: {filename}"
                  msg["From"] = sender
                  msg["To"] = ", ".join(recipients)
                  msg.set_content(
                      f"Hello,\n\nPlease find attached the weekly meetings report ({filename}).\n\n"
                      f"S3 Object: s3://{bucket}/{key}\n"
                  )
                  msg.add_attachment(
                      content,
                      maintype="text",
                      subtype="csv",
                      filename=filename,
                  )

                  ses_client.send_email(
                      FromEmailAddress=sender,
                      Destination={"ToAddresses": recipients},
                      Content={"Raw": {"Data": msg.as_bytes()}},
                  )
                  logger.info("Sent %s to %s via SES", filename, recipients)

              return {"status": "ok"}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  MailerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref "AWS::AccountId"

Outputs:
  ReportsBucketName:
    Description: Name of the private S3 reports bucket
    Value: !Ref ReportsBucket

  ReportsBucketArn:
    Value: !GetAtt ReportsBucket.Arn

  QueueUrl:
    Description: URL of the SQS report-requests queue
    Value: !Ref ReportRequestsQueue

  QueueArn:
    Value: !GetAtt ReportRequestsQueue.Arn

  DlqUrl:
    Description: URL of the Dead Letter Queue
    Value: !Ref ReportRequestsDlq

  DlqArn:
    Value: !GetAtt ReportRequestsDlq.Arn

  BuilderFunctionName:
    Value: !Ref BuilderFunction

  MailerFunctionName:
    Value: !Ref MailerFunction

  ScheduleName:
    Value: !Ref ReportSchedule
